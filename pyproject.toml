[tool.poetry]
name = "bankstatementparser-transport-ebics"
version = "0.0.1"
description = "EBICS 3.0 / 2.5 transport protocol adapter and automated statement fetcher for bankstatementparser."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/bankstatementparser-transport-ebics"
homepage = "https://bankstatementparser.com"
keywords = ["ebics", "ebics-3", "ebics-2.5", "banking-transport", "camt053", "camt054", "statements"]
packages = [
    { include = "bankstatementparser_transport_ebics" },
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
bankstatementparser = ">=0.0.18"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<10.0.0"
pytest-cov = "^7.1.0"
pytest-benchmark = "^5.1.0"
ruff = ">=0.15.7,<0.17"
mypy = ">=1.5,<3"
bandit = "^1.7.0"
hypothesis = ">=6.82,<7"
interrogate = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["*.md", "tmp_env", ".venv", ".eggs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "bankstatementparser.*",
    "pandas.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
fail-under = 100
exclude = ["setup.py", "docs", "build", "tests", ".venv"]
verbose = 2
quiet = false
color = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bankstatementparser_transport_ebics --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
