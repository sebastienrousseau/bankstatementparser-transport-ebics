name: Feature Request
description: Suggest a feature for bankstatementparser-transport-ebics
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: |
        What can't you do today with bankstatementparser-transport-ebics? If this surfaces an
        existing bankstatementparser helper, link to it.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        Sketch the new function or option: name, arguments,
        return shape. Reference the parent bankstatementparser API surface where
        relevant.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Real-World Use Case
      description: How would you use this in your statement pipeline?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options:
        - Request building
        - Response parsing
        - Statement parsing
        - Order types
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
  - type: textarea
    id: contribution
    attributes:
      label: Willingness To Contribute
      description: Could you take a stab at the implementation or tests?
